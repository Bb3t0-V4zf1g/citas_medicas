openapi: 3.0.3
info:
  title: "API de citas"
  version: "1.0"
  description: 'Todos los errores responden {"error", "detalles"}.'
paths:
  "/login":
    post:
      summary: "Iniciar sesión"
      description: "Autentica un usuario y devuelve un token JWT."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - usuario
                - clave
              properties:
                usuario:
                  type: string
                  example: admin
                clave:
                  type: string
                  format: password
                  example: admin12345
      responses:
        "200":
          description: "Inicio de sesión correcto"
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        "401":
          description: "Credenciales incorrectas"
        "422":
          description: "Datos de inicio de sesión inválidos"
  "/citas":
    get:
      summary: "Listar citas"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Lista"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Cita" }
        "401":
          description: "Token ausente, inválido o expirado"
        "403":
          description: "Usuario autenticado sin permisos para realizar la operación"
    post:
      summary: "Crear"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitaNuevo" }
      responses:
        "201":
          description: "Creado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "400": { $ref: "#/components/responses/JsonInvalido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/NoPermitido" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/DatosInvalidos" }
  "/citas/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: "Consultar uno"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Encontrado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/NoPermitido" }
        "404": { $ref: "#/components/responses/NoExiste" }
    put:
      summary: "Reemplazar completo"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CitaNuevo" }
      responses:
        "200":
          description: "Reemplazado"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cita" }
        "400": { $ref: "#/components/responses/JsonInvalido" }
        "404": { $ref: "#/components/responses/NoExiste" }
        "403": { $ref: "#/components/responses/NoPermitido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "409": { $ref: "#/components/responses/Conflicto" }
        "422": { $ref: "#/components/responses/DatosInvalidos" }
    delete:
      summary: "Borrar"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "Borrado"
        "404": { $ref: "#/components/responses/NoExiste" }
        "403": { $ref: "#/components/responses/NoPermitido" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CitaNuevo:
      type: object
      required:
        ["medico", "paciente", "horario_inicio", "horario_fin", "estado"]
      properties:
        "medico":
          type: string
          minLength: 5
          maxLength: 100
          description: "obligatorio, un nombre mínimo de 5 caracteres, si es posible poner todo el nombre y apellidos del médico"
        "paciente":
          type: string
          minLength: 5
          maxLength: 100
          description: "obligatorio, un nombre mínimo de 5 caracterés, si es posible poner todo el nombre y apellidos del paciente"
        "horario_inicio":
          type: string
          format: date-time
          description: "obligatorio, debe ser antes del horario de fin,  y acorde a la disponibilidad del médico, y después de la fecha actul"
        "horario_fin":
          type: string
          format: date-time
          description: "obligatorio, debe ser después del horario de inicio con una diferencia mínima de 1 hora, acorde a la disponibilidade del médico. Y después de la fecha actul"
        "estado":
          type: boolean
          description: "obligatorio, debe reflejar si la cita sigue en pie, se ha cancelado, se ha completado o se modificó"
        "fecha_de_registro":
          type: string
          format: date-time
          description: "obligatorio, debe guardar la fecha y hora exacta de cuando se hizo el registro o modificación"
    Cita:
      allOf:
        - $ref: "#/components/schemas/CitaNuevo"
        - type: object
          required: ["id", "fecha_de_registro"]
          properties:
            id:  
              type: integer 
            usuario_id: 
              type: string
              description: "Usuario propietario de la cita"
    Error:
      type: object
      required: ["error", "detalles"]
      properties:
        error: { type: string }
        detalles:
          type: array
          items: { type: string }
  responses:
    JsonInvalido:
      description: "El cuerpo no es un JSON válido"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatosInvalidos:
      description: "Los datos no cumplen las reglas"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoExiste:
      description: "No existe ese Cita"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflicto:
      description: "No se puede crear una cita si ya existe otra cita con estado 'activa' para el mismo medico y el mismo horario_inicio, ya que el medico no puede estar en dos lugares a la vez."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NoAutorizado:
      description: "No se proporcionó un token válido o el token expiró"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoPermitido:
      description: "El usuario autenticado no tiene permiso para realizar esta operación"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
